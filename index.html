<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse Xbox Game Pass and PlayStation Plus games by completion time. Find what's beatable this weekend.">
  <meta property="og:title" content="Beatable">
  <meta property="og:description" content="Browse Xbox Game Pass and PlayStation Plus games by completion time. Find what's beatable this weekend.">
  <meta property="og:site_name" content="Beatable">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Beatable</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="header-copy">
        <p class="eyebrow">Subscription Catalogs</p>
        <h1>Beatable</h1>
        <p class="last-updated">Find your next game. Know the time commitment.</p>
        <p class="last-updated" id="last-updated" hidden></p>
      </div>
    </header>

    <section class="filters-panel" aria-label="Filters">
      <div class="filters-top">
        <div class="filter-group filter-group-catalog">
          <span class="filter-label">Catalog</span>
          <div class="segmented-control" id="service-pills"></div>
        </div>

        <div class="filter-group filter-group-search">
          <label class="filter-label" for="search">Search</label>
          <input id="search" class="control-input" type="search" placeholder="Search titles...">
        </div>

        <div class="filter-group filter-group-platform">
          <label class="filter-label" for="platform-filter">Platform</label>
          <select id="platform-filter" class="control-input"></select>
        </div>
      </div>

      <div class="filters-bottom">
        <div class="filter-group filter-group-time">
          <span class="filter-label">Completion Time</span>
          <div class="time-pills" id="time-pills"></div>
        </div>
      </div>

      <div class="results-bar">
        <strong id="results-count">0 games</strong>
        <span id="results-context">Sorted by Main</span>
      </div>
    </section>

    <section class="sort-panel" aria-label="Sort controls">
      <div class="sort-tabs" id="sort-tabs">
        <button type="button" class="sort-tab" data-sort="gameplayMain">Main</button>
        <button type="button" class="sort-tab" data-sort="gameplayMainExtra">Main + Extra</button>
        <button type="button" class="sort-tab" data-sort="gameplayCompletionist">Completionist</button>
        <button type="button" class="sort-tab" data-sort="name">Title</button>
      </div>
    </section>

    <section class="results-panel">
      <div class="results-list" id="results-list"></div>
    </section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
