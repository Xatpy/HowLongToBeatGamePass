<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Browse Xbox Game Pass and PlayStation Plus games by completion time. Find what's beatable this weekend.">
  <meta property="og:title" content="Beatable">
  <meta property="og:description" content="Browse Xbox Game Pass and PlayStation Plus games by completion time. Find what's beatable this weekend.">
  <meta property="og:site_name" content="Beatable">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://xatpy.github.io/beatable/">
  <meta property="og:image" content="https://xatpy.github.io/beatable/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Beatable">
  <meta name="twitter:description" content="Browse Xbox Game Pass and PlayStation Plus games by completion time. Find what's beatable this weekend.">
  <meta name="twitter:image" content="https://xatpy.github.io/beatable/icons/icon-512.png">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Beatable — Browse Game Pass & PS Plus Games by Completion Time</title>
  <link rel="canonical" href="https://xatpy.github.io/beatable/">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://store-images.s-microsoft.com">
  <link rel="preconnect" href="https://image.api.playstation.com">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
  <h1 class="sr-only">Beatable — Game Pass and PS Plus completion times</h1>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon-32.png" srcset="icons/icon-64.png 2x, icons/icon-128.png 3x" alt="Beatable Logo" width="32" height="32" class="brand-logo">
        <span class="brand-name">Beatable</span>
      </div>
      <nav class="header-nav" id="header-nav" aria-label="Desktop navigation"></nav>
      <p class="last-updated" id="last-updated" hidden></p>
    </header>

    <section class="screen screen-browse" id="browse-screen" aria-label="Browse games">
      <section class="filters-panel" aria-label="Filters">
        <div class="search-row">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search" class="control-input" type="search" placeholder="Search games...">
        </div>

        <div class="filter-row filter-row-service">
          <div class="filter-group filter-group-service">
            <span class="filter-label">Service:</span>
            <nav class="service-tabs" id="service-pills" aria-label="Catalog selector"></nav>
          </div>
        </div>

        <div class="filter-row">
          <div class="filter-group filter-group-platform">
            <span class="filter-label">Platform:</span>
            <div class="platform-pills" id="platform-pills"></div>
          </div>

          <div class="filter-group filter-group-sort">
            <span class="filter-label">Sort By:</span>
            <div class="sort-pills" id="sort-tabs">
              <button type="button" class="sort-pill" data-sort="gameplayMain">Main Story</button>
              <button type="button" class="sort-pill" data-sort="gameplayMainExtra">Main + Extra</button>
              <button type="button" class="sort-pill" data-sort="gameplayCompletionist">Completionist</button>
              <button type="button" class="sort-pill" data-sort="reviewScore">Review</button>
            </div>
          </div>
        </div>

        <div class="filter-row filter-row-time">
          <div class="filter-group filter-group-time">
            <span class="filter-label">Length:</span>
            <div class="time-pills" id="length-pills"></div>
          </div>
        </div>

        <div class="filters-status" id="filters-status" hidden>✓ Filters saved</div>
      </section>

      <section class="results-panel">
        <div class="results-bar">
          <div class="results-bar-primary">
            <strong id="results-count">0 games</strong>
            <span id="results-status" class="results-status" hidden></span>
          </div>
          <div class="results-context" id="results-context"></div>
        </div>
        <div class="results-list" id="results-list"></div>
      </section>
    </section>

    <section class="screen screen-library" id="library-screen" aria-label="My Library" hidden>
      <section class="library-panel">
        <div class="library-header">
          <div>
            <p class="library-kicker">Personal Library</p>
            <h2 class="library-title">My Library</h2>
            <p class="library-subtitle">Stored on this device</p>
            <p class="library-copy">Keep your backlog, favorites, completed games, and hidden titles on this device.</p>
          </div>
          <div class="library-stats" id="library-stats"></div>
        </div>
        <div id="library-sections"></div>
        <p class="local-data-note">Your data stays local. No account needed.</p>
      </section>
    </section>
  </main>

  <nav class="primary-nav" id="primary-nav" aria-label="Primary navigation"></nav>

  <div class="detail-sheet" id="detail-sheet" hidden aria-hidden="true">
    <div class="detail-backdrop" data-action="close-detail"></div>
    <section class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div id="detail-content"></div>
    </section>
  </div>

  <div class="action-sheet" id="action-sheet" hidden aria-hidden="true">
    <div class="action-sheet-backdrop" data-action="close-actions"></div>
    <section class="action-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="action-sheet-title">
      <div id="action-sheet-content"></div>
    </section>
  </div>

  <div class="toast" id="toast" hidden aria-live="polite"></div>

  <script src="./js/app.js?v=4"></script>
</body>
</html>
